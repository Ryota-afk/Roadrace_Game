,fatigueDelta:10}},{label:`この感覚を大切に持ち帰る`,result:`焦らず感覚を反芻し、確かな手応えとして刻み込んだ。`,effects:{breakthroughDelta:3,mentalDelta:2}}]},{title:`限界突破のヒント`,text:`ベテラン選手から「壁は気持ちひとつで薄くなる」という言葉をもらった。`,choices:[{label:`言葉の意味を体で確かめる`,result:`限界だと思っていたラインの先に、まだ余地があると気づいた。`,effects:{breakthroughDelta:4}},{label:`心に留めて日々を過ごす`,result:`焦らずその言葉を胸に、腐らず練習を積んだ。`,effects:{breakthroughDelta:2,mentalDelta:2}}]},{title:`メンタルコーチとの対話`,text:`チーム専属のメンタルコーチと、調子の波との付き合い方について話した。`,choices:[{label:`波を受け入れるコツを学ぶ`,result:`好不調の波そのものを穏やかに捉えられるようになった。`,effects:{stabilityDelta:5}},{label:`ルーティンを一緒に作る`,result:`毎日決まった手順を踏むことで、調子が崩れにくくなった。`,effects:{stabilityDelta:4,formDelta:3}}]},{title:`自分なりのルーティンの確立`,text:`レース前に必ず行う一連の動作が、いつの間にか体に染みついていた。`,choices:[{label:`さらに徹底して守り抜く`,result:`決まった手順が心の支えとなり、調子が乱れにくくなった。`,effects:{stabilityDelta:5,fatigueDelta:3}},{label:`肩の力を抜いて緩やかに続ける`,result:`無理なく続けられる形に整え、じわりと安定感が増した。`,effects:{stabilityDelta:3,mentalDelta:2}}]},{title:`小さなお守り`,text:`応援してくれる人から、ささやかなお守りをもらった。ジンクスのように大切にしている。`,choices:[{label:`肌身離さず持ち歩く`,result:`根拠はなくとも、なぜか物事が上向く気がしてならない。`,effects:{luckDelta:5,mentalDelta:2}},{label:`感謝を伝え、気持ちを新たにする`,result:`支えてくれる人の存在に気づけたことが、何よりの財産になった。`,effects:{luckDelta:3,popularityDelta:2}}]},{title:`縁のめぐり合わせ`,text:`何気ない偶然の出会いが、思いがけず良い方向に転がり続けている。`,choices:[{label:`この流れに素直に乗ってみる`,result:`不思議と物事がうまく噛み合う日々が続いている。`,effects:{luckDelta:5}},{label:`浮かれず地に足つけて過ごす`,result:`浮つかず淡々と過ごしたことが、かえって良い流れを呼んだ。`,effects:{luckDelta:3,mentalDelta:2}}]},{title:`旅の行商人と謎の秘薬`,text:`遠征先の路地裏で、怪しい行商人が「これを飲めば見違える」と謎の秘薬を差し出してきた。`,choices:[{label:`断って立ち去る`,result:`怪しさに勝てず、丁重に断った。`,effects:{fatigueDelta:-2}},{label:`半信半疑で飲んでみる`,outcomes:[{weight:.28,result:`体の奥から力が漲るのを感じた……まさか本物だったとは！`,effects:{abBoost:6,breakthroughDelta:3}},{weight:.72,result:`ただ苦いだけの謎の液体だった。しばらく胃もたれが続いた。`,effects:{fatigueDelta:10,mentalDelta:-2}}]}]},{title:`自称・伝説の元プロによる特訓`,text:`「儂の指導を受ければ生まれ変わる」。素性の知れない老人が特訓を持ちかけてきた。`,choices:[{label:`丁重にお断りする`,result:`得体が知れず、大人しく通常メニューをこなした。`,effects:{}},{label:`藁にもすがる思いで受けてみる`,outcomes:[{weight:.25,result:`口だけではなかった。的確な指摘の連続で、目の覚めるような成長を遂げた。`,effects:{abBoost:8,fatigueDelta:14}},{weight:.35,result:`自己流の精神論に終始し、疲れだけが残った。`,effects:{fatigueDelta:16,mentalDelta:-3}},{weight:.4,result:`無難に基礎の再確認ができた程度だった。`,effects:{abBoost:2,fatigueDelta:8}}]}]},{title:`占い師のジンクス`,text:`たまたま入った占いの館で、「今週のあなたの運勢」を占ってもらえることになった。`,choices:[{label:`興味本位で聞いてみる`,outcomes:[{weight:.3,result:`「大吉。今のあなたには何をしても弾みがつく」――言われてみると、本当にそんな気がしてきた。`,effects:{luckDelta:8,mentalDelta:3}},{weight:.3,result:`「小凶。慎重に過ごしなさい」――妙に不安が残り、練習にも身が入らなかった。`,effects:{luckDelta:-5,mentalDelta:-2}},{weight:.4,result:`当たり障りのない結果で、特に気にせず過ごした。`,effects:{}}]},{label:`占いなど信じないと聞き流す`,result:`自分の力を信じ、いつも通り淡々と過ごした。`,effects:{mentalDelta:2}}]},{title:`峠の茶屋の謎かけ`,text:`山岳ステージの下見中に立ち寄った茶屋の店主から、妙な謎かけを持ちかけられた。`,choices:[{label:`受けて立つ`,outcomes:[{weight:.3,result:`見事に答えを言い当てると、店主が「お前さんは大成する」と太鼓判を押してくれた。妙に自信がついた。`,effects:{breakthroughDelta:6,mentalDelta:3}},{weight:.5,result:`答えられずに悔しい思いをした。少し落ち込みつつ峠を後にした。`,effects:{mentalDelta:-3}},{weight:.2,result:`店主が上機嫌になり、名物の団子をご馳走してくれた。ただそれだけの一日だった。`,effects:{fatigueDelta:-8}}]},{label:`苦笑いで受け流す`,result:`謎かけには付き合わず、下見に集中した。`,effects:{}}]},{title:`海外遠征先の怪しいマッサージ師`,text:`遠征先のホテルで、「疲労を根こそぎ取り除く」という触れ込みの施術師を紹介された。`,choices:[{label:`断って自分のケアを続ける`,result:`使い慣れたセルフケアで、無難に疲れを抜いた。`,effects:{fatigueDelta:-10}},{label:`思い切って施術を受ける`,outcomes:[{weight:.35,result:`驚くほど体が軽くなった。長年の張りまで取れたような感覚だ。`,effects:{fatigueDelta:-30,formDelta:6}},{weight:.35,result:`力加減が強すぎて、逆に体が張ってしまった。`,effects:{fatigueDelta:12,formDelta:-4}},{weight:.3,result:`可もなく不可もない、普通のマッサージだった。`,effects:{fatigueDelta:-8}}]}]},{title:`深夜ジムの謎のトレーナー`,text:`誰もいないはずの深夜のジムに、見知らぬトレーナーがいて「特別メニューをやってみないか」と誘われた。`,choices:[{label:`怪しみつつも断る`,result:`いつも通りのメニューをこなし、静かにジムを後にした。`,effects:{}},{label:`興味半分で付き合ってみる`,outcomes:[{weight:.2,result:`常識外れの負荷設定だったが、終えてみると別人のような力が漲っていた。`,effects:{abBoost:5,breakthroughDelta:4,fatigueDelta:15}},{weight:.5,result:`無茶な内容についていけず、翌日まで疲労を引きずった。`,effects:{fatigueDelta:22,formDelta:-5}},{weight:.3,result:`翌朝には姿が無く、夢だったのかと首を傾げるだけの一夜だった。`,eff
